name: Quality review
on:
  pull_request:
  push:
    branches: [main, master, 'quality/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python scripts/quality_review.py --output work/quality-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ matrix.os }}-${{ matrix.python }}
          path: work/quality-review/
          if-no-files-found: ignore
