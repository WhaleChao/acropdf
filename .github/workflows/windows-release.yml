name: Build Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release to receive verified packages
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip check

      - name: Run tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import subprocess,sys; sys.exit(subprocess.run([sys.executable, '-m', 'pytest', '-vv', '-o', 'faulthandler_timeout=60'], timeout=180).returncode)"

      - name: Build Windows package
        shell: pwsh
        run: python build_win.py --skip-preflight

      - name: Verify portable EXE, installed EXE and GUI startup
        shell: pwsh
        run: python scripts/verify_windows_package.py

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: AcroPDF-Windows
          retention-days: 3
          path: |
            dist/AcroPDF_win.zip
            dist/AcroPDF_win.zip.sha256
            dist/AcroPDF_Setup.exe
            dist/AcroPDF_Setup.exe.sha256
            dist/windows-package-validation.json
          if-no-files-found: error

      - name: Upload verified packages to draft release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.isDraft) {
            throw "Create a draft release before uploading validated packages."
          }
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:RELEASE_TAG" --jq .sha
          if ($LASTEXITCODE -ne 0 -or $tag -ne "${{ github.sha }}") {
            throw "Release tag must match the verified source commit."
          }
          gh release upload $env:RELEASE_TAG dist/AcroPDF_win.zip dist/AcroPDF_win.zip.sha256 dist/AcroPDF_Setup.exe dist/AcroPDF_Setup.exe.sha256 dist/windows-package-validation.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed." }
